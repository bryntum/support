name: Add labels on new issues. (Claude)
on:
  issues:
    types: [opened]

jobs:
  claude-response:
    runs-on: ubuntu-latest
    permissions:
      contents: read     # Required to checkout code
      id-token: write    # Required for requesting the OIDC JWT
      issues: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: provide a prompt for automation workflows
          prompt: |
            Analyze issue #${{ github.event.issue.number }} and apply appropriate labels from the repository's existing labels.

            Steps:
            1. Use 'gh issue view ${{ github.event.issue.number }}' to read the issue title and body
            2. Use 'gh label list' to see all available labels in the repository
            3. Based on the issue content, select 1-3 relevant labels that best categorize the issue
            4. Use 'gh issue edit ${{ github.event.issue.number }} --add-label "label1,label2"' to apply the selected labels

            Choose labels that accurately reflect the issue's type (bug, enhancement, documentation, etc.) and relevant areas/components.

          # Allow specific GitHub CLI commands needed for labeling
          claude_args: |
            --allowedTools "Bash(gh issue view *),Bash(gh label list),Bash(gh issue edit *)"
           
          # Disable @claude comment trigger - only run on issue open
          trigger_phrase: ""
